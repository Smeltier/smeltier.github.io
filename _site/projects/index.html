<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projetos | Smeltier's Homepage</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <nav class="container">
        <a href="/" class="">HOME</a>
        <a href="/about" class=""
          >ABOUT</a
        >
        <a
          href="/projects"
          class="active"
          >PROJECTS</a
        >
        <button
          class="theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="Alternar tema"
          aria-pressed="false"
        >
          <span class="theme-toggle-track">
            <span class="theme-toggle-icon theme-toggle-icon-sun">☀</span>
            <span class="theme-toggle-icon theme-toggle-icon-moon">☾</span>
            <span class="theme-toggle-thumb"></span>
          </span>
        </button>
      </nav>
    </header>
    <main class="site-content">
      <h1 id="projetos">Projetos</h1>

<h2 id="aicommit"><a href="/projects/ai_commit/">AICOMMIT</a></h2>

<p>Automatizando minhas mensagens de commit com IA</p>

<p><a href="https://github.com/Smeltier/aicommit">GitHub</a></p>


    </main>
    <script>
      var btn = document.getElementById("theme-toggle");
      var root = document.documentElement;
      function updateLabel() {
        var isDark = root.getAttribute("data-theme") === "dark";
        btn.setAttribute("aria-pressed", isDark ? "true" : "false");
      }
      updateLabel();
      btn.addEventListener("click", function () {
        var isDark = root.getAttribute("data-theme") === "dark";
        if (isDark) {
          root.removeAttribute("data-theme");
          localStorage.setItem("theme", "light");
        } else {
          root.setAttribute("data-theme", "dark");
          localStorage.setItem("theme", "dark");
        }
        updateLabel();
      });
    </script>
  </body>
</html>
