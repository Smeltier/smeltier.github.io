<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header>
      <a href="/" class="{% if page.url == '/' %}active{% endif %}">HOME</a>
      <a href="/about" class="{% if page.url == '/about' %}active{% endif %}"

      >
      <a
        href="/projects"
        class="{% if page.url == '/projects' %}active{% endif %}"

      >
    </header>
    <main>{{ content }}</main>
  </body>
</html>
