<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header>
      <nav class="container">
        <a href="/" class="{% if page.url == '/' %}active{% endif %}">HOME</a>
        <a href="/about" class="{% if page.url == '/about/' %}active{% endif %}"
          >About</a
        >
        <a
          href="/projects"
          class="{% if page.url == '/projects/' %}active{% endif %}"
          >Projects</a
        >
      </nav>
    </header>
    <main>{{ content }}</main>
  </body>
</html>
