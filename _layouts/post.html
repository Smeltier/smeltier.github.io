---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>

    {% if page.description %}
     <p class="post-description">{{ page.description }}</p>
    {% endif %}

    {% if page.date %}
    <time class="post-date"> {{ page.date | date: "%d/%m/%Y" }} </time>
    {% endif %}
  </header>

  <section class="post-content">{{ content }}</section>
</article>
